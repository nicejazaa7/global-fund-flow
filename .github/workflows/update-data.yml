name: Update data

on:
  schedule:
    - cron: "30 12 * * *"   # every day at 12:30 UTC, after fund companies publish the prior day's figures
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - name: Commit new data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%d)"
          git push
